[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbreaker"
version = "0.1.0"
description = "Modular AI Red Teaming and Vulnerability Assessment Framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hala Naaz (AshlynxCyber)", email = "research@ashlynxcyber.in" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]
reporting = [
    "jinja2>=3.1.3",
    "markdown>=3.6",
]
providers = [
    "openai>=1.20.0",
    "litellm>=1.35.0",
    "ollama>=0.1.9",
]

[project.scripts]
agentbreaker = "agentbreaker.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbreaker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
]
ignore = [
    "B008", # do not perform function calls in argument defaults (Typer uses Depends/Option)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # allow asserts and hardcoded test dummy tokens in tests
"scripts/*" = ["S101", "S603", "S607", "E501"] # allow benchmark prints, subprocesses, and test asserts

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
markers = [
    "unit: Deterministic unit tests running without external OS daemons or desktop sessions",
    "integration: Native OS integration tests interacting with actual OS credential providers",
    "windows: Tests specific to Windows operating system and Windows DPAPI",
    "linux: Tests specific to Linux operating system and Linux Secret Service",
    "credential_storage: Tests validating credential storage and migration components",
]
